manifest_version: 1
project:
  name: SparseDesign
  description: Minimal handcrafted import package for smoke testing. Contains a single buffer, 3 nets, and 2 components on a 100x100 um die.
  customer: AEGIS Smoke Corpus
  design_stage: place_route

artifacts:
  technology:
    - path: layout/technology.lef
      role: lef
  layout:
    - path: layout/top.def
      role: def
  netlist:
    - path: netlist/top.v
      role: verilog
  rules:
    - path: rules/aegis_rules.yaml
      role: aegis_rule_pack
  power:
    - path: power/power_domains.csv
      role: power_domains_csv
      optional: true
  current:
    - path: reports/current_report.csv
      role: current_csv
      optional: true
