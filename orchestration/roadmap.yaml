roadmap:
  name: "AEGIS-PERC"
  version: "1.0.0"
  description: "AI-assisted electrical rule verification and root-cause analysis platform"

  phases:
    - id: P1
      name: "Phase 1 — Commercial Foundation"
      goal: "Establish a production-grade codebase skeleton with build/test/observability infrastructure and a runnable application shell."
      deliverables:
        - Project architecture skeleton
        - Core service registry
        - Structured rotating logs
        - Diagnostic bundle export
        - Configuration schema validation
        - Configuration migration system
        - CI hardening
        - Test framework setup
        - Application shell
        - Synthetic sample dataset
      exit_criteria:
        - "CMake builds on Windows, Linux, and macOS"
        - "Unit tests run in under 60 seconds"
        - "Application launches to a dockable workspace"
        - "Logs are structured and exportable"
        - "Configuration loads with schema validation"

    - id: P2
      name: "Phase 2 — Verification Core"
      goal: "Implement layout/netlist import, intermediate representation, connectivity graph, and deterministic electrical rule checking."
      deliverables:
        - Layout/netlist import abstraction
        - JSON intermediate representation
        - DEF-like parser prototype
        - SPICE-like netlist parser prototype
        - Connectivity graph engine
        - Device/net/pin model
        - Power/signal domain tagging
        - Rule engine abstraction
        - Basic electrical rule checks
        - Violation result model
        - Deterministic test fixtures
      exit_criteria:
        - "Synthetic layouts parse into the intermediate representation"
        - "Graph represents devices, nets, and pins correctly"
        - "Rule engine runs without UI dependency"
        - "Violation model captures location, severity, and metadata"
        - "All core verification logic is unit-tested"

    - id: P3
      name: "Phase 3 — Visualization Core"
      goal: "Build interactive 2D layout canvas and violation inspection UI without owning business logic."
      deliverables:
        - 2D canvas
        - Layout rendering
        - Layer visibility
        - Pan/zoom/selection
        - Violation overlays
        - Connectivity tracing
        - Violation details panel
        - Graph exploration
        - Heatmap view
        - Report preview
      exit_criteria:
        - "Canvas loads the synthetic sample dataset and renders layers"
        - "Pan/zoom/selection operate at 60fps on 1M shapes"
        - "Violation overlays are toggleable per layer/rule"
        - "Details panel updates from selection, not direct model access"
        - "Graph view displays connectivity with zoom-based LOD"

    - id: P4
      name: "Phase 4 — AI/ML Core"
      goal: "Integrate optional ML-assisted classification, clustering, confidence scoring, and explainable root-cause recommendations."
      deliverables:
        - Feature extraction pipeline
        - Violation embedding model interface
        - Clustering engine
        - Similar violation search
        - ML inference abstraction
        - ONNX Runtime integration
        - Confidence scoring
        - Explainability model
        - Root-cause recommendation interface
        - Local AI assistant integration placeholder
      exit_criteria:
        - "ML pipeline initializes only when enabled"
        - "Feature extraction runs without blocking UI"
        - "Inference output includes confidence scores"
        - "Explainability hooks are consumable by UI and reporting"
        - "Core verification remains fully deterministic without ML"

    - id: P5
      name: "Phase 5 — Automation & Extensibility"
      goal: "Add Python scripting, batch CLI, plugin SDK, reporting, and local persistence."
      deliverables:
        - Python scripting API
        - Batch analysis CLI
        - Plugin SDK
        - Rule plugin interface
        - Parser plugin interface
        - Report generation
        - HTML/PDF export
        - Local database persistence
        - Project/session save-load
      exit_criteria:
        - "Python scripts can load a layout and trigger rule checks"
        - "CLI runs a batch job end-to-end with JSON report output"
        - "Plugins load dynamically with host version checks"
        - "Reports export to HTML and PDF with embedded diagrams"
        - "Sessions save and restore workspace state and analysis results"

    - id: P6
      name: "Phase 6 — Enterprise Readiness"
      goal: "Design distributed execution, complete packaging, and release engineering."
      deliverables:
        - Distributed job execution architecture
        - Worker process prototype
        - gRPC or IPC abstraction
        - Job queue
        - Progress reporting
        - Cancellation support
        - Large dataset performance benchmarks
        - Packaging
        - Installer
        - Release checklist
      exit_criteria:
        - "Job can be split across worker processes on localhost"
        - "Progress streams back to host in real time"
        - "Cancellation terminates workers cleanly without orphan processes"
        - "Benchmarks demonstrate acceptable throughput on 10M+ shape designs"
        - "Installer creates a signed, update-capable Windows deployment"

  dependencies:
    - P2 depends_on: [P1]
    - P3 depends_on: [P1, P2]
    - P4 depends_on: [P1, P2]
    - P5 depends_on: [P1, P2, P3, P4]
    - P6 depends_on: [P1, P2, P3, P4, P5]
