  - id: P12-003
    phase: P12
    title: "Implement full LEF technology-rule semantics and typed normalization"
    priority: high
    area: parsing
    risk: high
    depends_on: [P12-001, P12-002]
    acceptance:
      - Technology-rule semantics from LEF are normalized into typed internal models rather than string-only property bags.
