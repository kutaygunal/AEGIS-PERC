# AEGIS-PERC Task Registry
# Status values: todo | ready | in_progress | blocked | review | done
# A task can be marked 'ready' only if all dependencies are 'done'.

tasks:
  # ─────────────────────────────────────────────────────────
  # Sprint 3 — Visualization Core (P3) — CURRENT SPRINT
  # ─────────────────────────────────────────────────────────

  - id: P3-001
    phase: P3
    title: "UI scene adapter for LayoutIR"
    priority: critical
    area: ui
    risk: medium
    depends_on: []
    acceptance:
      - A read-only adapter converts LayoutIR layers, rectangles, polygons, ports, and annotations into UI scene records.
      - Scene records include stable IDs, layer names, colors, z-order, bounds, and source metadata for selection.
      - The adapter does not mutate LayoutIR and has no parsing or rule-checking logic.
      - Unit tests cover inverter and nand2 sample designs.
    implementation_rules:
      - Keep adapter classes in src/ui and depend only on public parsing data structures.
      - Use value types that can later be moved to a worker thread or GPU-backed renderer.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R UiScene"
    status: done

  - id: P3-002
    phase: P3
    title: "QWidget 2D layout canvas renderer"
    priority: critical
    area: ui
    risk: high
    depends_on: [P3-001]
    acceptance:
      - A QWidget-based canvas renders rectangles and polygons from UI scene records.
      - The canvas replaces the central placeholder in MainWindow.
      - Rendering honors layer color, layer order, and canvas background theme.
      - The widget owns only rendering and interaction state; business logic stays in core modules.
    implementation_rules:
      - Use QPainter for this sprint while keeping a renderer abstraction for future OpenGL or Vulkan.
      - Avoid direct file-format coupling and expose a minimal scene-loading API.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R LayoutCanvas"
    status: done

  - id: P3-003
    phase: P3
    title: "Canvas viewport controls, grid, and coordinates"
    priority: critical
    area: ui
    risk: medium
    depends_on: [P3-002]
    acceptance:
      - Mouse wheel zoom, middle-button or space-drag pan, fit-to-view, and reset-view actions work consistently.
      - A background grid can be toggled and scales with zoom without visual jitter.
      - Status bar displays cursor layout coordinates and current zoom level.
      - View transforms are numerically stable across repeated pan and zoom operations.
    implementation_rules:
      - Keep viewport transform math isolated and unit-testable.
      - Do not trigger layout parsing or rule execution from viewport events.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R \"Canvas viewport|Canvas grid\""
    status: done

  - id: P3-004
    phase: P3
    title: "Layer visibility and appearance panel"
    priority: high
    area: ui
    risk: medium
    depends_on: [P3-001, P3-002]
    acceptance:
      - Layers dock lists all LayoutIR layers in draw order with visibility checkboxes.
      - Users can toggle individual layers and quickly show all, hide all, or isolate one layer.
      - Layer swatches display configured colors with safe fallback colors.
      - Canvas updates without reloading the design.
    implementation_rules:
      - Represent layer visibility as UI state, not modifications to LayoutIR.
      - Use Qt model/view where practical to support large layer counts.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R \"per-layer visibility|layer panel\""
    status: done

  - id: P3-005
    phase: P3
    title: "Shape, port, and annotation selection workflow"
    priority: high
    area: ui
    risk: medium
    depends_on: [P3-002, P3-003]
    acceptance:
      - Click selection identifies the nearest visible shape, port, or annotation using scene IDs.
      - Multi-select with modifier keys is supported for visible canvas items.
      - Selected items are highlighted on the canvas.
      - Properties dock updates through a selection model instead of direct core model access.
    implementation_rules:
      - Implement hit testing independently from painting to keep behavior deterministic.
      - Keep the selection model reusable by violation and graph views.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -L P3-005"
    status: done

  - id: P3-006
    phase: P3
    title: "Violation overlay rendering"
    priority: critical
    area: ui
    risk: high
    depends_on: [P3-002, P3-003]
    acceptance:
      - Canvas renders violation markers and bounding highlights from ViolationCollection records.
      - Overlay appearance reflects severity and remains visible at different zoom levels.
      - Overlays can be enabled or disabled without changing core violation data.
      - Missing or partial violation locations degrade gracefully with list-only entries.
    implementation_rules:
      - Treat violations as read-only inputs from rules module.
      - Keep severity styling centralized for reuse by details and report preview UI.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R ViolationOverlay"
    status: todo

  - id: P3-007
    phase: P3
    title: "Violation explorer and details panel"
    priority: critical
    area: ui
    risk: medium
    depends_on: [P3-005, P3-006]
    acceptance:
      - A dockable violation explorer lists rule ID, severity, message, layer, net, device, and pin columns.
      - Selecting a violation updates the details panel and centers the canvas on available location data.
      - Details view shows metadata key-value pairs and a copyable stable violation ID.
      - The panel consumes ViolationCollection through a UI model, not direct rule-engine ownership.
    implementation_rules:
      - Use Qt item models to support filtering and future pagination.
      - Do not execute rules from the details panel; it only displays provided results.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R ViolationExplorer"
    status: todo

  - id: P3-008
    phase: P3
    title: "Violation filtering, search, and overlay toggles"
    priority: high
    area: ui
    risk: medium
    depends_on: [P3-004, P3-007]
    acceptance:
      - Users can filter violations by severity, rule ID, layer, net, and free-text search.
      - Canvas overlays update to match the active violation filter.
      - Filter summary counts are visible in the violation explorer header or status bar.
      - Clear-filter action restores the full violation set.
    implementation_rules:
      - Implement filtering in UI model/proxy classes so source violation data remains unchanged.
      - Keep filter state serializable for future session persistence.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R ViolationFilter"
    status: todo

  - id: P3-009
    phase: P3
    title: "Connectivity trace interaction"
    priority: high
    area: ui
    risk: high
    depends_on: [P3-005]
    acceptance:
      - Selecting a net, port, device pin, or violation location can request a connectivity trace by stable name.
      - Canvas highlights traced nets and related shapes without modifying the ConnectivityGraph.
      - Trace controls support clear trace and focus trace actions.
      - Unresolved or missing graph references produce user-visible nonfatal feedback.
    implementation_rules:
      - Access graph data through a read-only presentation adapter.
      - Keep tracing asynchronous-ready; avoid blocking the UI event loop on large graphs.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R ConnectivityTrace"
    status: todo

  - id: P3-010
    phase: P3
    title: "Connectivity graph exploration dock"
    priority: high
    area: ui
    risk: high
    depends_on: [P3-009]
    acceptance:
      - A dockable graph explorer displays devices, nets, pins, and edges from ConnectivityGraph.
      - Users can search nodes by name and sync graph selection with canvas selection where possible.
      - Large graphs use zoom or expansion based level-of-detail to avoid overwhelming the UI.
      - Graph explorer is optional and can be hidden from the View menu.
    implementation_rules:
      - Prefer Qt model/view or a lightweight custom widget before adding external graph UI dependencies.
      - The graph dock must not own or mutate core graph data.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R GraphExplorer"
    status: todo

  - id: P3-011
    phase: P3
    title: "Violation density heatmap view"
    priority: medium
    area: ui
    risk: medium
    depends_on: [P3-006, P3-008]
    acceptance:
      - Heatmap mode visualizes violation density over layout coordinates.
      - Users can toggle heatmap visibility and adjust opacity.
      - Heatmap respects active violation filters and visible layers where locations allow.
      - Empty or locationless violation sets show a clear empty-state message.
    implementation_rules:
      - Build heatmap buckets from UI-level violation/location data only.
      - Keep color ramp and opacity settings centralized for future preferences UI.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R ViolationHeatmap"
    status: todo

  - id: P3-012
    phase: P3
    title: "Interactive report preview dock"
    priority: medium
    area: ui
    risk: medium
    depends_on: [P3-007, P3-011]
    acceptance:
      - Report preview dock summarizes design name, layer count, violation counts by severity, and selected violation details.
      - Preview includes a canvas snapshot or placeholder hook for future exported diagrams.
      - Preview updates when active filters or selection change.
      - No file export is implemented in this sprint; export remains reserved for P5.
    implementation_rules:
      - Reuse reporting module interfaces where available but keep this as preview-only UI.
      - Avoid duplicating report-generation business logic in widgets.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R ReportPreview"
    status: todo

  - id: P3-013
    phase: P3
    title: "Workspace actions, toolbar, and shortcuts"
    priority: medium
    area: ui
    risk: low
    depends_on: [P3-003, P3-004, P3-007]
    acceptance:
      - Toolbar exposes open sample, fit view, reset view, toggle grid, toggle overlays, run-checks placeholder, and clear selection actions.
      - Menus and dock toggle actions are wired to actual widgets instead of placeholders.
      - Common shortcuts are registered and discoverable through tooltips or menu labels.
      - Actions enable and disable based on whether a scene or violation set is loaded.
    implementation_rules:
      - Use shared QAction instances so menus, toolbars, and shortcuts stay synchronized.
      - Run-checks remains a UI command hook and must not add rule-engine logic in widgets.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R WorkspaceActions"
    status: todo

  - id: P3-014
    phase: P3
    title: "Rendering performance instrumentation and LOD cache"
    priority: high
    area: ui
    risk: high
    depends_on: [P3-002, P3-003, P3-006]
    acceptance:
      - Canvas records frame time, visible item count, total item count, and overlay count in a lightweight metrics object.
      - Status bar or diagnostics panel can show performance metrics in debug/developer mode.
      - Level-of-detail rules skip or simplify offscreen and tiny geometry.
      - Synthetic stress test data can exercise up to 1M generated shapes without changing core sample files.
    implementation_rules:
      - Keep instrumentation low overhead and disable expensive metrics in normal operation.
      - Cache transformed or indexed geometry only in UI-owned structures.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R CanvasPerformance"
    status: todo

  - id: P3-015
    phase: P3
    title: "Visualization workflow tests and sample-data smoke path"
    priority: high
    area: ui
    risk: medium
    depends_on: [P3-008, P3-010, P3-012, P3-013, P3-014]
    acceptance:
      - Automated UI tests verify main window creation, canvas installation, dock presence, layer toggles, selection model updates, and violation filter behavior.
      - A smoke workflow loads data/sample_designs/inverter.json into the UI scene without launching parser dialogs.
      - Manual test checklist covers pan, zoom, selection, overlays, graph dock, heatmap, and report preview.
      - Existing P1 app-shell tests continue to pass.
    implementation_rules:
      - Keep tests headless-compatible where possible using Qt offscreen platform support.
      - Do not rely on local user QSettings state; tests must clean up persisted settings.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R Ui"
    status: todo

  # ─────────────────────────────────────────────────────────
  # Sprint 4 — AI/ML Core (P4) — early tasks
  # ─────────────────────────────────────────────────────────

  - id: P4-001
    phase: P4
    title: "Feature extraction from violations"
    priority: high
    area: ml
    risk: high
    depends_on: []
    acceptance:
      - A pipeline extracts numerical and categorical features from violation contexts.
      - Features are graph-local (adjacent devices, net properties, geometry counts).
      - Output is a normalized feature vector.
      - No inference logic yet; only extraction.
      - Unit tests verify deterministic output on fixed inputs.
    implementation_rules:
      - Keep extraction read-only; do not modify violations or graph.
      - Support incremental extraction for future interactive updates.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure --R FeatureExtraction"
    status: todo

  # ─────────────────────────────────────────────────────────
  # Sprint 5 — Automation & Extensibility (P5) — early tasks
  # ─────────────────────────────────────────────────────────

  - id: P5-001
    phase: P5
    title: "Batch analysis CLI"
    priority: high
    area: scripting
    risk: medium
    depends_on: []
    acceptance:
      - A headless CLI executable loads a layout and runs rule checks.
      - Output is a JSON report to stdout or file.
      - Exit codes distinguish success, violations found, and fatal errors.
      - No Qt Widgets dependency; QtCore is acceptable for event loop if needed.
      - Unit tests verify CLI behavior with synthetic samples.
    implementation_rules:
      - Reuse core services; do not duplicate rule logic.
      - Keep the CLI thin; it is a host for the core workflow.
    test_commands:
      - "cmake --build build --config Release"
      - "aegis-perc-cli --input samples/inverter.json --report out.json"
      - "ctest --test-dir build --output-on-failure --R BatchCLI"
    status: todo

  # ─────────────────────────────────────────────────────────
  # Sprint 6 — Enterprise Readiness (P6) — design task
  # ─────────────────────────────────────────────────────────

  - id: P6-001
    phase: P6
    title: "Distributed job execution design doc"
    priority: medium
    area: architecture
    risk: medium
    depends_on: []
    acceptance:
      - Documented architecture covers host, worker, job queue, and IPC.
      - Scenarios include localhost multi-process and future multi-node.
      - Failure modes, retries, and cancellation are addressed.
      - No implementation code; design only.
    implementation_rules:
      - Produce a markdown design document under docs/design/distributed.md.
      - Reference existing module boundaries.
      - Identify dependencies on external libraries (gRPC, ZeroMQ, etc.).
    test_commands:
      - "docs/design/distributed.md exists and passes spell check"
    status: todo
