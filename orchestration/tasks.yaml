  - id: P12-001
    phase: P12
    title: "Expand LEF coverage toward full 5.x grammar compatibility"
    priority: high
    area: parsing
    risk: high
    depends_on: [P9-001]
    acceptance:
      - LEF parsing supports a substantially broader LEF 5.x grammar surface beyond the current MVP subset.
      - Common industrial constructs that appear in technology and abstract libraries are parsed or explicitly classified with structured unsupported diagnostics.
      - Grammar support is documented by statement/block coverage so customers know what is fully supported vs partially supported.
      - Regression tests include representative LEF 5.x fixtures beyond the single shipped sample.
    implementation_rules:
      - Preserve backward compatibility with the current normalized LEF data model where practical.
      - Prefer explicit parse-state coverage over ad-hoc keyword exceptions.
      - Unsupported constructs must remain visible through diagnostics rather than being silently skipped.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build --output-on-failure -R Lef"
      - "ctest --test-dir build --output-on-failure -R Parsing"
