  - id: P12-002
    phase: P12
    title: "Add advanced LEF geometry/forms and richer abstract-shape normalization"
    priority: high
    area: parsing
    risk: high
    depends_on: [P12-001]
    acceptance:
      - LEF normalization supports advanced geometry/forms beyond the current RECT-centric subset where required by common industrial macro abstracts.
      - Parsed geometry is preserved with enough fidelity for downstream visualization, obstruction handling, and future rule semantics.
      - Geometry normalization validates malformed shapes and reports actionable source diagnostics.
      - Tests cover mixed per-layer shape content in PIN, PORT, OBS, and VIA contexts.
    implementation_rules:
      - Keep normalized geometry independent of any one rendering backend.
      - Preserve source-line provenance for every emitted geometry primitive.
      - Do not collapse unsupported forms into lossy approximations without explicit metadata.
    test_commands:
