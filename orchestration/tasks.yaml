  - id: S1-011
    sprint: S1
    title: "Waiver authoring helper: export waiver candidates from selected findings"
    priority: low
    area: ui
    risk: low
    depends_on: [S1-003]
    acceptance:
      - UI can export a waiver template (CSV/YAML) for currently selected findings.
      - Export includes identity keys and minimal context for human review.
      - Tests validate deterministic ordering and content on seeded fixtures.
    implementation_rules:
      - Export uses core identity keys; do not invent UI-only identifiers.
      - Provide explicit confirmation before writing files in interactive UI.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R UiWorkflow"
    status: todo

  - id: S1-012
    sprint: S1
    title: "Documentation: signoff workflow guide (baseline, diff, waivers)"
    priority: medium
    area: docs
    risk: low
    depends_on: [S1-006, S1-007]
    acceptance:
      - Docs include step-by-step commands for creating a baseline and running a diff gate.
      - Docs specify the baseline schema version and compatibility expectations.
      - Docs explain waiver audit semantics (active vs waived).
    implementation_rules:
      - Keep examples runnable against repo fixtures.
      - Do not document unimplemented distributed features.
    test_commands:
      - "cmake --build build --config Release"
    status: todo

  - id: S1-013
    sprint: S1
    title: "Stress fixtures: generate large violation sets and validate diff/waiver performance"
    priority: medium
    area: testing
    risk: medium
    depends_on: [S1-005]
    acceptance:
      - Tests generate large synthetic violation sets (>= 1M identities) without OOM on CI-friendly configs.
      - Diff and waiver-application paths complete within a reasonable budget (documented threshold).
      - Tests are deterministic and do not depend on wall-clock timing.
    implementation_rules:
      - Prefer generated fixtures; do not add huge binary artifacts.
      - Keep stress tests opt-in by label if necessary.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R SignoffStress"
    status: todo

  - id: S1-014
    sprint: S1
    title: "UI: simplify first-launch workspace (hide optional docks + toolbar groups)"
    priority: high
    area: ui
    risk: low
    depends_on: []
    acceptance:
      - On a clean first launch (no QSettings), only the mandatory surfaces are visible: menu bar, slim toolbar (import / samples / run checks), central canvas, log dock, and the workspace summary / onboarding panel.
      - Optional docks (Layers, Graph Explorer, Hierarchy, Trace, Report Preview, Violations, Diagnostics, Jobs) are hidden by default and re-shown automatically when a design is imported, a check run completes, or a trace is requested.
      - A `View → Panels` submenu exposes every dock as a toggleable action so users can re-enable any hidden panel.
      - User-driven hide survives `save_window_state` / `restore_window_state`; auto-show never overrides an explicit user choice.
      - Headless tests cover: default empty-state dock visibility, `set_workspace_state` transitions, panel menu wiring, and QSettings persistence of user choices.
    implementation_rules:
      - Keep the implementation additive: introduce a `WorkspaceState` enum and a `default_dock_visibility_for_state` table; do not delete existing dock creation code.
      - All visibility changes must be reversible; never call `deleteLater()` on a dock from a hide operation.
      - Do not change dock widget order or area in the persistent state — only initial visibility.
    test_commands:
      - "cmake --build build/windows-release --config Release"
      - "ctest --test-dir build/windows-release -C Release --output-on-failure -R UiWorkflow"
      - "ctest --test-dir build/windows-release -C Release --output-on-failure -R UiStates"
      - "ctest --test-dir build/windows-release -C Release --output-on-failure -R WorkspaceActions"
      - "ctest --test-dir build/windows-release -C Release --output-on-failure -R WorkspacePersistence"
    status: review

  # =================================================================================================
  # Sprint 2 — Rule Engine Programmability
  # Big idea: rule packs can currently only select/parameterize a fixed set of built-in C++ checks.
  # Close the gap toward a genuinely programmable rule engine incrementally, starting with a
  # declarative condition format rather than committing to a full rule DSL up front.
  # Source: docs-external commercial gap analysis (2026-08-14), priority gap "no programmable rule language".
  # =================================================================================================

  - id: S2-001
    sprint: S2
    title: "Rules: declarative `type: condition` rule pack entries (field/operator/value checks)"
    priority: high
    area: rules
    risk: medium
    depends_on: []
    acceptance:
      - A rule pack (JSON or YAML) can define a `type: condition` entry with `target: device|net|pin` and a `conditions` list of `{field, operator, value}` predicates, without any new C++ rule class.
      - Supported operators: equals, not_equals, greater_than, greater_or_equal, less_than, less_or_equal, contains, exists, not_exists.
      - Multiple conditions in one rule are combined with AND; a node is flagged only if every condition holds.
      - Field resolution covers device (name, device_type, arbitrary properties), net (name, arbitrary properties), and pin (name, direction, layer, x, y).
      - `message` supports `{name}` / `{field}` template substitution; a reasonable default message is generated when `message` is omitted.
      - RulePackLoader validation rejects: missing/invalid `target`, empty `conditions`, unsupported operator, and a comparison operator missing `value` (exists/not_exists are exempt).
      - Existing built-in rule types (floating_net, power_domain_mismatch, em_current_limit) are unaffected — full existing rules test suite still passes.
      - New behavior is documented in docs/design/declarative_rules.md.
    implementation_rules:
      - Keep this additive: extend RulePackRuleDefinition (target/conditions/message) and RulePackLoader; do not change the public shape of existing built-in rule types.
      - No OR/NOT combinators and no cross-node predicates in this iteration — out of scope, documented as such.
      - Reuse the existing PropertyValue scalar type for condition values instead of introducing a parallel value representation.
    test_commands:
      - "cmake --build build/windows-release --config Release --target aegis_unit_tests"
      - "ctest --test-dir build/windows-release -C Release --output-on-failure -L rules"
    status: review

  # =================================================================================================
  # Sprint 3 — Gap Analysis Follow-ons
  # Big idea: address the larger, previously-unscheduled gaps named in the 2026-08-14 commercial
  # gap analysis (GDSII/OASIS ingestion, physical/reliability checks, distributed execution) as
  # scoped first increments, plus the near-term quick wins from the companion product-lens gap
  # analysis. Delivered by four parallel agents in isolated worktrees; merged via an integration
  # branch (integration/sprint3-gap-analysis) with a clean combined build/test pass.
  # Source: docs-external commercial gap analysis (2026-08-14, engineering lens) +
  #         product gap analysis (2026-08-14, "AEGIS-PERC as a product, not a codebase").
  # =================================================================================================

  - id: S3-001
    sprint: S3
    title: "Parsing: native GDSII binary parser (first increment); OASIS deferred"
    priority: medium
    area: parsing
    risk: medium
    depends_on: []
    acceptance:
      - "A GdsiiParser conforming to IParser reads a subset of GDSII binary stream records (HEADER, BGNLIB, LIBNAME, UNITS, BGNSTR, STRNAME, BOUNDARY, LAYER, DATATYPE, XY, ENDEL, ENDSTR, ENDLIB) into LayoutIR."
      - "Malformed record length and unsupported record types produce diagnostics, not crashes or fatal errors; unsupported records are skipped with deduplicated warnings."
      - "Cancellation tokens stop parsing mid-stream, matching the existing LEF/DEF parser contract."
      - "OASIS ingestion and GDSII PATH/SREF/AREF/TEXT/BOX records are explicitly out of scope and documented as such in docs/design/gdsii_oasis_ingestion.md."
    implementation_rules:
      - Keep this additive: new files only (gdsii_parser.hpp/.cpp); do not modify existing LEF/DEF parser behavior.
      - No dependency on rules engine, ML, or Qt Widgets (parsing module boundary, AGENTS.md).
      - Reuse the existing LayoutIR geometry representation; do not introduce a parallel geometry type.
    test_commands:
      - "cmake --build build --config Release --target aegis_unit_tests"
      - "ctest --test-dir build -C Release --output-on-failure -L Gdsii"
    status: review

  - id: S3-002
    sprint: S3
    title: "Rules: antenna-ratio physical/reliability check (first increment)"
    priority: medium
    area: rules
    risk: medium
    depends_on: []
    acceptance:
      - "A new type: antenna_ratio built-in rule flags a net when accumulated connected metal area exceeds a configurable multiple of the total gate area of MOSFETs connected to it via their gate terminal."
      - "Threshold is parameterizable from a rule pack, following the existing em_current_limit pattern."
      - "Missing/unparsable geometry data does not crash; the node is not flagged, matching the em_current_limit convention for unparsable data."
      - "Existing built-in and declarative-condition rule types are unaffected — full existing rules test suite still passes."
      - "Known gap documented rather than papered over: LayoutIR::geometries (routing polygons) is not yet linked to ConnectivityGraph nets, so true per-net metal-area accumulation from raw LEF/DEF/GDSII geometry is not yet computable; the rule currently consumes a metal_area_um2 net property, ready to fire once a future enrichment stage populates it."
    implementation_rules:
      - Keep this additive: new physical_rules.hpp/.cpp; do not modify electrical_rules.* directly.
      - No dependency on ML or Qt Widgets (rules module boundary, AGENTS.md).
    test_commands:
      - "cmake --build build --config Release --target aegis_unit_tests"
      - "ctest --test-dir build -C Release --output-on-failure -R PhysicalRules"
    status: review

  - id: S3-003
    sprint: S3
    title: "Orchestration: distributed execution Phase 2 (localhost host/worker split)"
    priority: medium
    area: orchestration
    risk: high
    depends_on: []
    acceptance:
      - "Phase 2 of docs/design/distributed.md's evolution path is implemented: host/worker process split, shared-filesystem artifact/job handoff, lease/heartbeat, durable job metadata — built on top of LocalJobPipeline, not replacing it."
      - "No new external dependency introduced (filesystem + OS-level exclusive-create APIs only, per the existing 'no gRPC/ZeroMQ/Redis at this time' project constraint)."
      - "Cancellation reaches a terminal Cancelled state, not Failed; worker crash/stale heartbeat triggers full-job retry (not partial-stage resume, an explicit non-goal) capped by max_retries; retried output is byte-identical given identical inputs."
      - "aegis_orchestration remains headless (no Qt Widgets dependency)."
      - "Phases 3 (blob-backed) and 4 (multi-node/remote) from docs/design/distributed.md are explicitly not started."
    implementation_rules:
      - Reuse LocalJobPipeline's staged parse/normalize/graph_build/rule_execution/report_export logic; do not reimplement it.
      - Reuse ProjectPackage + ImportPreflightValidator for job submission; do not reinvent import/validation.
      - Update docs/design/distributed.md's Status line only; do not otherwise rewrite the accepted design.
    test_commands:
      - "cmake --build build --config Release --target aegis_unit_tests"
      - "ctest --test-dir build -C Release --output-on-failure -L s3-003"
    status: review

  - id: S3-004
    sprint: S3
    title: "Product: gap-analysis quick wins (trust statement, wedge, CONTRIBUTING, demo walkthrough)"
    priority: medium
    area: docs
    risk: low
    depends_on: []
    acceptance:
      - "README states a local-execution/data-handling claim only after verifying no outbound network calls exist in the core loop (grep-verified, with the one found caveat — storage's documented-but-unimplemented 'enterprise upload' responsibility — disclosed rather than omitted)."
      - "README documents the run→waive→diff→gate CI-gate wedge explicitly, describing existing tested behavior, not new functionality."
      - "CONTRIBUTING.md exists and links to AGENTS.md as the source of truth for module boundaries."
      - "A reproducible demo walkthrough script exists (scripts/demo_walkthrough.sh/.ps1) using an existing CLI-ingestible fixture, with any substitution from the originally-named sample data disclosed."
      - "Beachhead-segment and open-source-vs-open-core recommendations are recorded as a proposed (not accepted) DEC-009 for the repo owner to decide — not decided unilaterally by the task."
    implementation_rules:
      - Do not publish an unverified trust/data-handling claim as fact.
      - Do not silently resolve the 'commercial-grade' README framing tension against DEC-009 — flag it, don't edit around it.
      - Only orchestration file this task may write to is DECISIONS.md (one new proposed entry); tasks.yaml/roadmap.yaml/HANDOFF.md updated centrally instead.
    test_commands:
      - "N/A — documentation/scripts only; no build required for this task's own changes."
    status: review
