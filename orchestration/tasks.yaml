# AEGIS-PERC Task Registry
# Status values: todo | ready | in_progress | blocked | review | done
# A task can be marked 'ready' only if all dependencies are 'done'.

tasks:
  # =================================================================================================
  # Sprint 1 — Signoff Workflow (Waivers + Baselines + Regression Diff)
  # Big idea: make AEGIS-PERC usable in real verification loops:
  #   run checks → suppress known issues → review new/changed → gate automation → export diff reports
  # =================================================================================================

  - id: S1-001
    sprint: S1
    title: "Define violation identity + normalization contract"
    priority: high
    area: rules
    risk: high
    depends_on: []
    acceptance:
      - Violation results expose a stable, deterministic "identity key" suitable for waivers and regression diffing.
      - Identity construction is documented and unit-tested (seeded inputs produce identical keys).
      - Identity remains stable across minor formatting changes (e.g., message text tweaks) but changes when the underlying issue meaningfully changes.
    implementation_rules:
      - Keep identity generation in core/rules (no UI dependency).
      - Prefer explicit fields (rule_id, object stable_id, location) over free-text hashing.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R ViolationIdentity"
    status: review

  - id: S1-002
    sprint: S1
    title: "Implement waiver model + parser (CSV/YAML/JSON)"
    priority: high
    area: rules
    risk: medium
    depends_on: [S1-001]
    acceptance:
      - Waiver artifacts are parsed into a typed waiver model (rule scope, identity matchers, optional expiry/owner/comment fields).
      - Parser diagnostics are deterministic and include line/row provenance when available.
      - Invalid waivers never crash analysis; they produce actionable diagnostics.
    implementation_rules:
      - Do not add UI-specific fields; keep the waiver model domain-focused.
      - Treat unknown columns/fields as warnings, not fatal errors.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R Waivers"
    status: review

  - id: S1-003
    sprint: S1
    title: "Apply waivers during rule results assembly"
    priority: high
    area: rules
    risk: high
    depends_on: [S1-002]
    acceptance:
      - Waived violations are marked/suppressed deterministically (and remain available for audit/export).
      - Report output includes counts for total vs active vs waived findings.
      - Headless tests verify waiver matching on synthetic and imported-design fixtures.
    implementation_rules:
      - Waiver application must happen in core/rules or orchestration, not in UI.
      - Never drop waived findings silently; keep an audit trail.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R WaiverApplication"
    status: review

  - id: S1-004
    sprint: S1
    title: "Baseline format (JSON) + schema versioning"
    priority: high
    area: reporting
    risk: medium
    depends_on: [S1-001]
    acceptance:
      - A versioned baseline file can be written and read deterministically.
      - Baseline includes identity keys, severity, rule id, and minimal stable context needed for diffing.
      - Loading mismatched versions fails safely with actionable diagnostics.
    implementation_rules:
      - Keep baseline format compact and stable; avoid embedding huge payloads.
      - "Add explicit `baseline_schema_version`."
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R BaselineIO"
    status: review

  - id: S1-005
    sprint: S1
    title: "Regression diff engine (new/removed/changed) + metrics"
    priority: high
    area: reporting
    risk: high
    depends_on: [S1-004, S1-003]
    acceptance:
      - Diff engine computes deterministic sets: new, removed, unchanged, and changed-severity findings.
      - Diff summarizes by rule id and severity with totals suitable for gating.
      - Unit tests cover deterministic ordering and edge cases (duplicate identities, missing keys).
    implementation_rules:
      - No UI dependency; expose a pure data model usable by CLI/UI.
      - Keep sorting stable for snapshot tests.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R RegressionDiff"
    status: review

  - id: S1-006
    sprint: S1
    title: "CLI: add `baseline` subcommand (write) and `diff` subcommand"
    priority: high
    area: scripting
    risk: medium
    depends_on: [S1-004, S1-005]
    acceptance:
      - "`aegis-perc-cli baseline ... --output baseline.json` writes a baseline after running checks."
      - "`aegis-perc-cli diff --baseline baseline.json ... --output diff.json` emits diff and exits with meaningful codes."
      - CLI is deterministic and test-covered.
    implementation_rules:
      - Reuse existing CLI workflow plumbing; do not fork a second analysis path.
      - Exit codes must distinguish "new violations" vs fatal error.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R \"aegis-perc-cli\""
    status: review

  - id: S1-007
    sprint: S1
    title: "Report generator: add baseline + diff JSON export"
    priority: medium
    area: reporting
    risk: medium
    depends_on: [S1-004, S1-005]
    acceptance:
      - Reporting exports baseline and diff JSON with stable field ordering.
      - Export includes run metadata (timestamp, tool version, project name, rule pack id when available).
      - Snapshot tests verify stable outputs on seeded fixtures.
    implementation_rules:
      - Keep data assembly separate from serialization.
      - Prefer explicit structs over ad-hoc JSON construction.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R Reporting"
    status: review

  - id: S1-008
    sprint: S1
    title: "UI: show waiver + baseline/diff summary in Workspace Summary"
    priority: medium
    area: ui
    risk: low
    depends_on: [S1-003, S1-005]
    acceptance:
      - Workspace Summary distinguishes active vs waived findings and highlights new vs regressed findings when a baseline is present.
      - UI uses the diff data model; it does not re-run diff logic itself.
      - Headless UI workflow tests cover the summary text/state transitions.
    implementation_rules:
      - Reuse existing workspace-summary panel infrastructure.
      - Keep UI logic presentation-only; no core state mutation.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R UiWorkflow"
    status: review

  - id: S1-009
    sprint: S1
    title: "UI: violation explorer supports 'Active vs Waived' filter pill"
    priority: medium
    area: ui
    risk: medium
    depends_on: [S1-003]
    acceptance:
      - Users can toggle between active and waived findings without losing selection context.
      - Filtering does not change deterministic export/reporting results.
      - Regression tests cover filter toggle and selection persistence.
    implementation_rules:
      - Use model/proxy filtering patterns; avoid per-item widget mutation.
      - Keep cross-probing semantics unchanged.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R UiWorkflow"
    status: todo

  - id: S1-010
    sprint: S1
    title: "CI gating: add 'no new errors' mode for diff"
    priority: medium
    area: orchestration
    risk: medium
    depends_on: [S1-006]
    acceptance:
      - A documented CI command fails when new Error-severity findings are introduced vs a baseline.
      - Output clearly lists the top regressions and summary counts.
      - A local reproduction path is documented.
    implementation_rules:
      - Do not require UI; must run headless.
      - Keep output deterministic for CI logs.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R BatchCLI"
    status: todo

  - id: S1-011
    sprint: S1
    title: "Waiver authoring helper: export waiver candidates from selected findings"
    priority: low
    area: ui
    risk: low
    depends_on: [S1-003]
    acceptance:
      - UI can export a waiver template (CSV/YAML) for currently selected findings.
      - Export includes identity keys and minimal context for human review.
      - Tests validate deterministic ordering and content on seeded fixtures.
    implementation_rules:
      - Export uses core identity keys; do not invent UI-only identifiers.
      - Provide explicit confirmation before writing files in interactive UI.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R UiWorkflow"
    status: todo

  - id: S1-012
    sprint: S1
    title: "Documentation: signoff workflow guide (baseline, diff, waivers)"
    priority: medium
    area: docs
    risk: low
    depends_on: [S1-006, S1-007]
    acceptance:
      - Docs include step-by-step commands for creating a baseline and running a diff gate.
      - Docs specify the baseline schema version and compatibility expectations.
      - Docs explain waiver audit semantics (active vs waived).
    implementation_rules:
      - Keep examples runnable against repo fixtures.
      - Do not document unimplemented distributed features.
    test_commands:
      - "cmake --build build --config Release"
    status: todo

  - id: S1-013
    sprint: S1
    title: "Stress fixtures: generate large violation sets and validate diff/waiver performance"
    priority: medium
    area: testing
    risk: medium
    depends_on: [S1-005]
    acceptance:
      - Tests generate large synthetic violation sets (>= 1M identities) without OOM on CI-friendly configs.
      - Diff and waiver-application paths complete within a reasonable budget (documented threshold).
      - Tests are deterministic and do not depend on wall-clock timing.
    implementation_rules:
      - Prefer generated fixtures; do not add huge binary artifacts.
      - Keep stress tests opt-in by label if necessary.
    test_commands:
      - "cmake --build build --config Release"
      - "ctest --test-dir build -C Release --output-on-failure -R SignoffStress"
    status: todo
